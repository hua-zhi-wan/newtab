<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空白页</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
        }

        /* 主题变量定义 */
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --text-secondary: #666;
            --card-bg: white;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.05);
            --border-color: #ddd;
            --accent-color: #4e6ef2;
            --accent-light: #e8f3ff;
            --danger-color: #ff4d4f;
        }

        .dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e6e6e6;
            --text-secondary: #aaa;
            --card-bg: #2a2a40;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.2);
            --border-color: #3a3a52;
            --accent-color: #4e6ef2;
            --accent-light: rgba(78, 110, 242, 0.1);
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
        }

        /* 深色模式切换按钮 - 固定在页面右上角 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: none;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), 
                        inset 0 -3px 10px rgba(0, 0, 0, 0.05),
                        inset 0 3px 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), 
                        inset 0 -3px 10px rgba(0, 0, 0, 0.05),
                        inset 0 3px 10px rgba(255, 255, 255, 0.5);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .dark-mode .theme-toggle {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 
                        inset 0 -3px 10px rgba(0, 0, 0, 0.2),
                        inset 0 3px 10px rgba(255, 255, 255, 0.05);
        }

        .dark-mode .theme-toggle:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 
                        inset 0 -3px 10px rgba(0, 0, 0, 0.2),
                        inset 0 3px 10px rgba(255, 255, 255, 0.05);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .theme-toggle .icon-sun {
            color: #f39c12;
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .icon-moon {
            color: #f5f7fa;
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }

        .dark-mode .theme-toggle .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }

        .dark-mode .theme-toggle .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .sun-rays {
            transform-origin: center;
            animation: none;
        }

        .theme-toggle:hover .sun-rays {
            animation: spin-slow 3s linear infinite;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 顶部日期样式 */
        .date-container {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        #date {
            font-size: 24px;
            font-weight: 600;
        }

        #weekday {
            font-size: 18px;
            margin-top: 8px;
            color: var(--text-secondary);
        }

        /* 搜索框样式 */
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        #search-input {
            width: 100%;
            height: 50px;
            padding: 0 50px 0 20px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            outline: none;
            box-shadow: var(--card-shadow);
            background-color: var(--card-bg);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        #search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 2px 12px rgba(78, 110, 242, 0.15);
        }

        .dark-mode #search-input:focus {
            box-shadow: 0 2px 12px rgba(78, 110, 242, 0.3);
        }

        #search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        #search-btn:hover {
            background-color: #3a5dd9;
        }

        /* 导航网格样式 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-item-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            padding: 15px 0;
            border-radius: 8px;
            width: 100%;
        }

        .nav-item:hover {
            background-color: var(--card-bg);
            box-shadow: var(--card-shadow);
            transform: translateY(-2px);
        }

        .nav-item:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .nav-icon-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
        }

        .nav-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .nav-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: var(--danger-color);
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 10;
        }

        .nav-item-wrapper:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            transform: scale(1.15);
            background-color: #e04346;
        }

        .delete-btn:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .nav-name {
            font-size: 14px;
            text-align: center;
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 添加按钮样式 */
        .add-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent-light);
            color: var(--accent-color);
            font-size: 24px;
            border: 2px dashed var(--accent-color);
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
        }

        .dark-mode .add-btn {
            border-color: rgba(78, 110, 242, 0.5);
            color: rgba(78, 110, 242, 0.8);
        }

        .add-btn:hover {
            background-color: #dceaff;
            transform: scale(1.05);
        }

        .dark-mode .add-btn:hover {
            background-color: rgba(78, 110, 242, 0.2);
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--card-shadow);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .modal-form .form-group {
            margin-bottom: 15px;
        }

        .modal-form label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .modal-form input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .modal-form input:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .cancel-btn {
            background-color: var(--border-color);
            color: var(--text-secondary);
        }

        .cancel-btn:hover {
            background-color: #e8e8e8;
        }

        .dark-mode .cancel-btn:hover {
            background-color: #4a4a62;
        }

        .confirm-btn {
            background-color: var(--accent-color);
            color: white;
        }

        .confirm-btn:hover {
            background-color: #3a5dd9;
        }

        /* 加载指示器 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .nav-icon {
                width: 50px;
                height: 50px;
            }
            
            .nav-icon img {
                width: 28px;
                height: 28px;
            }
            
            .nav-name {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 深色模式切换按钮 - 固定在页面右上角 -->
    <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换深色/浅色主题">
        <!-- 太阳图标 - 浅色模式显示 -->
        <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <g class="sun-rays" fill="currentColor">
                <rect x="11" y="1" width="2" height="4" rx="1"/>
                <rect x="11" y="19" width="2" height="4" rx="1"/>
                <rect x="1" y="11" width="4" height="2" rx="1"/>
                <rect x="19" y="11" width="4" height="2" rx="1"/>
                <rect x="4.22" y="4.22" width="2" height="4" rx="1" transform="rotate(-45 5.22 6.22)"/>
                <rect x="17.78" y="17.78" width="2" height="4" rx="1" transform="rotate(-45 18.78 19.78)"/>
                <rect x="4.22" y="15.78" width="2" height="4" rx="1" transform="rotate(45 5.22 17.78)"/>
                <rect x="17.78" y="2.22" width="2" height="4" rx="1" transform="rotate(45 18.78 4.22)"/>
            </g>
        </svg>
        <!-- 月亮图标 - 深色模式显示 -->
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>

    <div class="container">
        <!-- 日期显示区 -->
        <div class="date-container">
            <div id="date"></div>
            <div id="weekday"></div>
        </div>

        <!-- 搜索区 -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="输入关键词搜索...">
            <button id="search-btn">
                <!-- 内置放大镜图标 -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5,14h-0.79l-0.28-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09-0.59 4.23-1.57l0.27,0.28v0.79l5,4.99L20.49,19L15.5,14z M9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/>
                </svg>
            </button>
        </div>

        <!-- 导航链接区 -->
        <div class="nav-grid" id="navGrid">
            <!-- 链接将通过JS动态生成 -->
        </div>

        <!-- 添加按钮 -->
        <div class="add-btn" id="addBtn">+</div>
    </div>

    <!-- 添加链接模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">添加新链接</div>
            <form class="modal-form" id="addForm">
                <div class="form-group">
                    <label for="siteName">网站名称</label>
                    <input type="text" id="siteName" placeholder="例如：百度" required>
                </div>
                <div class="form-group">
                    <label for="siteUrl">网站地址</label>
                    <input type="url" id="siteUrl" placeholder="例如：https://www.baidu.com" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel-btn" id="cancelBtn">取消</button>
                    <button type="submit" class="modal-btn confirm-btn" id="confirmBtn">添加</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 在DOM加载前就检查并应用主题，避免闪烁
        (function() {
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                document.documentElement.classList.add('dark-mode');
            }
        })();

        // 存储链接数据
        let bookmarks = [];
        // 检查用户偏好的主题模式
        const isDarkMode = localStorage.getItem('darkMode') === 'true';

        // DOM元素
        const navGrid = document.getElementById('navGrid');
        const addBtn = document.getElementById('addBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const addForm = document.getElementById('addForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const confirmBtn = document.getElementById('confirmBtn');
        const themeToggle = document.getElementById('themeToggle');

        // 初始化主题模式
        function initTheme() {
            // 主题已经在页面加载前应用，这里只需要设置切换事件
            themeToggle.addEventListener('click', toggleTheme);
        }

        // 切换主题模式
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // 显示当前日期和星期
        function updateDate() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[date.getDay()];
            
            document.getElementById('date').textContent = `${year}-${month}-${day}`;
            document.getElementById('weekday').textContent = weekday;
        }

        // 获取网站favicon URL（使用Google Favicon服务，不受CORS限制）
        function getFaviconUrl(siteUrl) {
            try {
                const url = new URL(siteUrl);
                const domain = url.hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (error) {
                console.error('URL解析失败:', error);
                return null;
            }
        }

        // 生成默认图标SVG
        function getDefaultIcon() {
            return 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzRFOkVGMiIgZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMC00LjQ4LTEwLTEwLTEwem0wIDE4YzQuNDIgMCA4LTMuNTggOC04cy0zLjU4LTgtOC04LTgtMy41OCA4LTggOC04IDMtNS44IDgtOC4wMnoiLz48cGF0aCBkPSJNMTEgMTVIMTR2LTRIMTF2NHptMC02aDN2MmgtM3YtMnoiLz48L3N2Zz4=';
        }

        // 渲染导航链接
        function renderBookmarks() {
            navGrid.innerHTML = '';
            
            bookmarks.forEach((bookmark, index) => {
                const navItem = document.createElement('div');
                navItem.className = 'nav-item-wrapper';
                
                const faviconUrl = bookmark.favicon || getFaviconUrl(bookmark.url) || getDefaultIcon();
                
                navItem.innerHTML = `
                    <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer" class="nav-item">
                        <div class="nav-icon-container">
                            <div class="nav-icon">
                                <img src="${faviconUrl}" 
                                     alt="${bookmark.name}" 
                                     onerror="this.src='${getDefaultIcon()}'"
                                     loading="lazy">
                            </div>
                        </div>
                        <div class="nav-name">${bookmark.name}</div>
                    </a>
                    <button class="delete-btn" data-index="${index}" title="删除此链接" aria-label="删除 ${bookmark.name}">×</button>
                `;
                
                navGrid.appendChild(navItem);
            });
            
            // 添加删除事件监听
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const index = parseInt(btn.getAttribute('data-index'));
                    if (confirm('确定要删除这个链接吗？')) {
                        deleteBookmark(index);
                    }
                });
            });
        }

        // 添加新链接
        function addBookmark(name, url) {
            if (!name || !url) {
                alert('请填写网站名称和地址');
                return;
            }
            
            // 确保URL以http://或https://开头
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            // 验证URL格式
            try {
                new URL(url);
            } catch (error) {
                alert('请输入有效的网址，例如：https://www.example.com');
                return;
            }
            
            // 检查是否已存在相同URL
            const exists = bookmarks.some(b => b.url === url);
            if (exists) {
                alert('该网址已存在');
                return;
            }
            
            // 创建新书签对象（不再缓存favicon，使用Google服务动态获取）
            const newBookmark = { 
                name: name.trim(), 
                url: url
            };
            
            bookmarks.push(newBookmark);
            saveBookmarks();
            renderBookmarks();
            
            // 关闭模态框并重置表单
            modalOverlay.classList.remove('active');
            addForm.reset();
        }

        // 删除链接
        function deleteBookmark(index) {
            if (index < 0 || index >= bookmarks.length) {
                console.error('无效的索引:', index);
                return;
            }
            bookmarks.splice(index, 1);
            saveBookmarks();
            renderBookmarks();
        }

        // 保存链接到本地存储
        function saveBookmarks() {
            try {
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            } catch (error) {
                console.error('保存书签失败:', error);
                if (error.name === 'QuotaExceededError') {
                    alert('存储空间不足，请删除一些链接后重试');
                }
            }
        }

        // 从本地存储加载书签
        function loadBookmarks() {
            try {
                const stored = localStorage.getItem('bookmarks');
                return stored ? JSON.parse(stored) : [];
            } catch (error) {
                console.error('加载书签失败:', error);
                return [];
            }
        }

        // 初始化搜索功能（使用Bing）
        function initSearch() {
            // 点击搜索按钮触发搜索
            searchBtn.addEventListener('click', () => {
                const keyword = searchInput.value.trim();
                if (keyword) {
                    window.open(`https://www.bing.com/search?q=${encodeURIComponent(keyword)}`, '_blank');
                }
            });

            // 按回车键触发搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    searchBtn.click();
                }
            });
        }

        // 初始化模态框
        function initModal() {
            addBtn.addEventListener('click', () => {
                modalOverlay.classList.add('active');
                document.getElementById('siteName').focus();
            });

            cancelBtn.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
                addForm.reset();
                // 恢复按钮状态
                confirmBtn.innerHTML = '添加';
                confirmBtn.disabled = false;
            });

            addForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('siteName').value.trim();
                const url = document.getElementById('siteUrl').value.trim();
                
                if (name && url) {
                    addBookmark(name, url);
                }
            });

            // 点击模态框外部关闭
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                    addForm.reset();
                    // 恢复按钮状态
                    confirmBtn.innerHTML = '添加';
                    confirmBtn.disabled = false;
                }
            });
        }

        // 页面加载时初始化
        window.onload = function() {
            bookmarks = loadBookmarks();
            initTheme();
            updateDate();
            renderBookmarks();
            initSearch();
            initModal();
        };
    </script>
</body>
</html>
